[package]
name = "week4-first-program"
version = "0.1.0"
edition = "2021"
description = "Счётчик на чистом Solana SDK (без Anchor)"

[lib]
crate-type = ["cdylib", "lib"]

[features]
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
